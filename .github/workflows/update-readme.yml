name: Auto-Update README Activity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  update-readme:
    # 阻斷無限迴圈：機器人自己觸發的更新直接跳過
    if: github.actor != 'github-actions[bot]'  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5
          token: ${{ secrets.REPO_TOKEN }} 

      - name: Fetch Recent Commits
        run: |
          COMMITS=$(git log -3 --pretty=format:"- %h: %s (%an)")
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update README content
        run: |
          awk -v commits="$COMMITS" '
          /<!-- START_RECENT_ACTIVITY -->/ {
            print
            print ""
            print commits
            print ""
            skip = 1
            next
          }
          /<!-- END_RECENT_ACTIVITY -->/ {
            skip = 0
          }
          !skip { print }
          ' README.md > temp_readme.md
          mv temp_readme.md README.md

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: auto-update recent activity"
          
          # 智慧判斷：如果是 push 就推播更新；如果是 PR 就只測試不推播，避免報錯
          if [ "${{ github.event_name }}" == "push" ]; then
            git push
          else
            echo "此為 Pull Request 階段，僅進行預覽與測試，跳過 git push 以免產生錯誤。"
          fi
